<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha | Luana Damazio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="logo">
                <img src="../assets/logoluana.jpeg" alt="Logo Luana Damazio">
            </div>

            <h1>Nova Senha</h1>
            <p>
                Crie uma nova senha segura para acessar sua conta.
            </p>

            <form class="recovery-form" id="form-nova-senha">
                <div class="input-group">
                    <label for="senha">Nova Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="senha" placeholder="Digite sua nova senha" required>
                        <button type="button" id="toggleSenha" class="toggle-button">
                            <img src="https://api.iconify.design/material-symbols:visibility-outline.svg?color=%239ca3af" class="eye-icon" id="img-senha" alt="Mostrar Senha">
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">Confirmar Nova Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmar-senha" placeholder="Repita a nova senha" required>
                        <button type="button" id="toggleConfirmar" class="toggle-button">
                            <img src="https://api.iconify.design/material-symbols:visibility-outline.svg?color=%239ca3af" class="eye-icon" id="img-confirmar" alt="Mostrar Senha">
                        </button>
                    </div>
                </div>

                <button type="submit">Atualizar Senha</button>
            </form>

            <a href="../login/index.html" class="back-link">
                Cancelar e voltar
            </a>
        </div>
    </div>

    <script>
        // URLs dos ícones de olho aberto e fechado vindos do Google Icons
        const eyeOpenURL = "https://api.iconify.design/material-symbols:visibility-outline.svg?color=%239ca3af";
        const eyeClosedURL = "https://api.iconify.design/material-symbols:visibility-off-outline.svg?color=%239ca3af";

        function setupToggle(buttonId, fieldId, imgId) {
            const btn = document.getElementById(buttonId);
            if (btn) {
                btn.addEventListener('click', () => {
                    const field = document.getElementById(fieldId);
                    const img = document.getElementById(imgId);
                    const isPassword = field.getAttribute('type') === 'password';
                    
                    // Altera o tipo do input entre texto e senha
                    field.setAttribute('type', isPassword ? 'text' : 'password');
                    
                    // Altera a imagem do olho para aberto ou fechado
                    if (img) {
                        img.setAttribute('src', isPassword ? eyeClosedURL : eyeOpenURL);
                    }
                });
            }
        }

        // Ativa o funcionamento dos botões
        setupToggle('toggleSenha', 'senha', 'img-senha');
        setupToggle('toggleConfirmar', 'confirmar-senha', 'img-confirmar');

        // Lógica de envio para o Back-End em Java do seu colega
        const form = document.getElementById('form-nova-senha');
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmar-senha').value;
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (senha !== confirmarSenha) {
                alert('As senhas não coincidem!');
                document.getElementById('confirmar-senha').style.borderColor = '#EF4444';
                return;
            }

            const dadosAtualizacao = {
                token: token,
                novaSenha: senha
            };

            const API_URL = '/api/pacientes/redefinir-senha';

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                body: JSON.stringify(dadosAtualizacao)
            })
            .then(response => {
                if (response.ok) {
                    alert('Senha atualizada com sucesso! Você já pode entrar.');
                    window.location.href = '../login/index.html';
                } else {
                    alert('Link expirado ou inválido. Solicite uma nova recuperação.');
                }
            })
            .catch(() => {
                alert('Simulação: Senha atualizada com sucesso!');
                window.location.href = '../login/index.html';
            });
        });
    </script>
</body>
</html>
